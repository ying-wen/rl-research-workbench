name: checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  base:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_repository.py
      - name: Exercise documented CLI on a small continual study
        run: |
          python -m rlworkbench init --profile continual --out studies/ci.json
          python -m rlworkbench validate studies/ci.json
          python -m rlworkbench freeze studies/ci.json --out studies/ci.lock.json
          python -m rlworkbench run studies/ci.lock.json --out runs/ci
          python -m rlworkbench audit runs/ci
          python -m rlworkbench report runs/ci --out runs/ci-report.md
  deep:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e . -r examples/deep-requirements.txt
      - run: RLWORKBENCH_TEST_DEEP=1 python -m unittest discover -s tests -v
